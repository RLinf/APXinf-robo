name: Installation and adapter compatibility
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pinned, main]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apxinf -> target
      - name: Select upstream main for forward compatibility
        if: matrix.engine == 'main'
        run: |
          git -C apxinf fetch origin main
          git -C apxinf checkout --detach FETCH_HEAD
          git -C apxinf submodule update --init --recursive
      - name: Install complete runtime in a clean environment
        run: |
          python -m venv /tmp/apxinf-robo-test
          /tmp/apxinf-robo-test/bin/python scripts/install.py --cpu-only --extra dev --extra serve
          /tmp/apxinf-robo-test/bin/python -I apxinf/scripts/check_python_install.py
          /tmp/apxinf-robo-test/bin/apxinf-robo --help
      - name: Run adapter and engine contracts
        run: /tmp/apxinf-robo-test/bin/python -m pytest tests -q
